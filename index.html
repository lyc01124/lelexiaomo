<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>星空</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; cursor: default; }
  canvas { display: block; position: fixed; top: 0; left: 0; z-index: 0; }

  #toggle-panel-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 100;
    padding: 8px 14px;
    border: none;
    border-radius: 8px;
    background: rgba(255,255,255,0.2);
    color: #fff;
    cursor: pointer;
    backdrop-filter: blur(8px);
  }
  #toggle-panel-btn:hover {
    background: rgba(255,255,255,0.35);
  }

  #side-panel {
    position: fixed;
    top: 0;
    left: 0;
    height: 100%;
    width: 320px;
    background: rgba(20,20,20,0.85);
    backdrop-filter: blur(12px);
    z-index: 99;
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    padding: 20px;
    box-sizing: border-box;
    color:#fff;
    overflow-y:auto;
  }
  #side-panel.open {
    transform: translateX(0);
  }
  .panel-group{
    margin-bottom:24px;
  }
  .panel-group label{
    display:block;
    margin:8px 0 4px;
    font-size:13px;
    opacity:0.9;
  }
  .value-text{
    font-size:12px;
    opacity:0.7;
  }
  .btn-row{
    display:flex;
    gap:8px;
    margin-top:8px;
  }
  .panel-btn{
    flex:1;
    padding:6px;
    border:none;
    border-radius:6px;
    cursor:pointer;
  }
  .count-info{
    margin: 6px 0 12px;
    font-size:14px;
  }

  #enter-btn {
    position: fixed;
    left: 50%;
    top: 66.67vh;
    transform: translate(-50%, -50%);
    z-index: 2;
    padding: 12px 38px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 999px;
    color: rgba(255, 255, 255, 0.9);
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    font-size: 15px;
    letter-spacing: 0.32em;
    padding-left: calc(38px + 0.32em);
    cursor: pointer;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: all 0.8s cubic-bezier(.2,.7,.2,1);
    opacity: 1;
  }
  #enter-btn:hover {
    background: rgba(255, 255, 255, 0.15);
    border-color: rgba(255, 255, 255, 0.7);
    box-shadow: 0 0 24px rgba(180, 210, 255, 0.2);
  }
  #enter-btn.hidden {
    opacity: 0;
    transform: translate(-50%, -24px);
    pointer-events: none;
  }

  .main-page {
    position: fixed;
    inset: 0;
    z-index: 1;
    opacity: 0;
    transition: opacity 1.2s cubic-bezier(.2,.7,.2,1);
  }
  .main-page.on {
    opacity: 1;
  }

  #control-panel {
    position: absolute;
    right: 5%;
    top: calc(50% - 72% / 2 - 110px);
    width: 42%;
    height: auto;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.10);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.35);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.16);
    padding: 16px 20px;
    box-sizing: border-box;
    display: flex;
    gap:16px;
    align-items: center;
    flex-wrap: wrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  #control-panel.active {
    opacity: 1;
    pointer-events: auto;
  }
  .control-item{
    display:flex;
    align-items:center;
    gap:8px;
    color:#fff;
    font-size:14px;
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
  }
  .control-item input[type="color"]{
    width:36px;
    height:28px;
    border:none;
    border-radius:6px;
    cursor:pointer;
  }
  .control-item input[type="number"]{
    width:70px;
    padding:4px;
    border-radius:6px;
    border:none;
    outline:none;
  }
  .control-item button{
    padding:5px 10px;
    border-radius:6px;
    border:none;
    cursor:pointer;
  }

  #glass-editor {
    position: absolute;
    right: 5%;
    top: 50%;
    transform: translateY(-50%);
    width: 42%;
    height: 72%;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.10);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.35);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.16);
    padding: 28px 32px;
    box-sizing: border-box;
    transition: all 1s cubic-bezier(.7,.2,.2,1);
  }
  #rich-editor {
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: #000;
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    font-size: 15px;
    line-height: 2;
    letter-spacing: 0.05em;
    cursor: text;
    font-weight: normal;
    overflow:auto;
  }
  #rich-editor[disabled] {
    color: rgba(0, 0, 0, 0.6);
    cursor: default;
    pointer-events:none;
  }

  .btn-base {
    position: absolute;
    padding: 10px 36px;
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 999px;
    color: #000;
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    font-size: 14px;
    letter-spacing: 0.3em;
    padding-left: calc(36px + 0.3em);
    cursor: pointer;
    transition: all 0.6s cubic-bezier(.2,.7,.2,1);
    z-index: 2;
  }
  .btn-base:hover {
    background: rgba(255, 255, 255, 0.65);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
  }
  .btn-base.hidden {
    opacity: 0;
    transform: translateX(-50%) translateY(12px);
    pointer-events:none;
  }
  .btn-base.download-init{
    opacity:0;
    transform: translateX(-50%) translateY(12px);
    pointer-events:none;
  }
  .btn-base.show {
    opacity:1;
    pointer-events:auto;
  }

  #save-btn {
    left: 70%;
    bottom: 7%;
    transform: translateX(-50%) translateY(0px);
  }
  #download-btn {
    left: 82%;
    bottom: 7%;
  }

  @media (max-width: 768px) {
    #toggle-panel-btn {
      top:12px;
      left:12px;
      padding:6px 10px;
      font-size:12px;
    }
    #control-panel{
      width:88%;
      right:6%;
      top:calc(14% - 110px);
    }
    #glass-editor {
      width: 88%;
      right: 6%;
      height: 55%;
      top: auto;
      bottom: 14%;
      transform: none;
    }
    #save-btn {
      left: 40%;
      bottom: 5%;
    }
    #download-btn {
      left: 65%;
      bottom: 5%;
    }
  }
</style>
</head>
<body>

<audio id="bgAudio" src="1.mp3" preload="auto" loop>

<button id="toggle-panel-btn">打开面板</button>
<div id="side-panel">
  <div class="panel-group">
    <h4 style="margin:0 0 10px;">粒子摆放</h4>

    <label style="display:flex;align-items:center;gap:6px;">
      <input type="checkbox" id="enableParticleSwitch" checked>
      开启点击生成粒子
    </label>

    <div class="count-info">粒子数量：<span id="particleCount">0</span></div>

    <label>粒子大小 <span class="value-text" id="sizeVal">6</span></label>
    <input type="range" id="particleSizeSlider" min="1" max="20" value="6" step="0.5">

    <label>光晕强度 <span class="value-text" id="glowVal">3.0</span></label>
    <input type="range" id="glowSlider" min="0" max="8" value="3" step="0.1">

    <label>轨迹长度 <span class="value-text" id="trailLenVal">40</span></label>
    <input type="range" id="trailLengthSlider" min="5" max="120" value="40" step="1">

    <label>运动模式</label>
    <select id="motionModeSelect" style="width:100%;padding:4px;border-radius:4px;">
      <option value="static">静止（仅拖拽）</option>
      <option value="orbitNear">环绕附近粒子</option>
    </select>

    <label>环绕半径 <span class="value-text" id="orbitRadiusVal">80</span></label>
    <input type="range" id="orbitRadiusSlider" min="20" max="200" value="80" step="1">

    <label>环绕速度 <span class="value-text" id="orbitSpeedVal">0.8</span></label>
    <input type="range" id="orbitSpeedSlider" min="0.1" max="3" value="0.8" step="0.1">

    <div class="btn-row">
      <button class="panel-btn" id="undoParticleBtn">撤回上一个</button>
      <button class="panel-btn" id="clearParticles">清空粒子</button>
    </div>
  </div>
</div>

<button id="enter-btn">进入主页</button>

<div class="main-page" id="mainPage">
  <div id="control-panel">
    <div class="control-item">
      <label>字体颜色</label>
      <input type="color" id="color-picker" value="#000000">
    </div>
    <div class="control-item">
      <label>字号(px)</label>
      <input type="number" id="size-input" min="8" max="200" step="0.5" value="15">
    </div>
    <div class="control-item">
      <button id="bold-btn">加粗</button>
    </div>
    <div class="control-item">
      <button id="alignLeft">靠左</button>
      <button id="alignCenter">居中</button>
      <button id="alignRight">靠右</button>
    </div>
  </div>

  <div id="glass-editor">
    <div id="rich-editor" contenteditable="true"></div>
  </div>
  <button id="save-btn" class="btn-base">保存</button>
  <button id="download-btn" class="btn-base download-init">下载</button>
</div>

<script>
let state = 0;
const STAR_COUNT = 1200;
const STAR_SPHERE_RADIUS = 900;
const stars = [];

let currRotX = 0, currRotY = 0;
let targetRotX = 0, targetRotY = 0;
const ROT_LERP = 0.06;

let particleAngle = 0;
const ORBIT_RADIUS = 60;

let mouseXDoc = 0;
let mouseYDoc = 0;
let savedRange = null;

let placedParticles = [];
let particleSize = 6;
let glowStrength = 3.0;
let enableParticle = true;
let trailMaxLength = 40;
let motionMode = "static";
let orbitRadiusSetting = 80;
let orbitSpeedSetting = 0.8;

let draggingIndex = -1;
let dragOffsetX = 0;
let dragOffsetY = 0;

const bgAudio = document.getElementById('bgAudio');

const sizeSlider = document.getElementById('particleSizeSlider');
const glowSlider = document.getElementById('glowSlider');
const trailLengthSlider = document.getElementById('trailLengthSlider');
const sizeValText = document.getElementById('sizeVal');
const glowValText = document.getElementById('glowVal');
const trailLenValText = document.getElementById('trailLenVal');
const orbitRadiusSlider = document.getElementById('orbitRadiusSlider');
const orbitRadiusValText = document.getElementById('orbitRadiusVal');
const orbitSpeedSlider = document.getElementById('orbitSpeedSlider');
const orbitSpeedValText = document.getElementById('orbitSpeedVal');
const motionModeSelect = document.getElementById('motionModeSelect');
const clearBtn = document.getElementById('clearParticles');
const undoBtn = document.getElementById('undoParticleBtn');
const switchEl = document.getElementById('enableParticleSwitch');
const countEl = document.getElementById('particleCount');

function updateCount() {
  countEl.innerText = placedParticles.length;
}
updateCount();

switchEl.onchange = ()=>{
  enableParticle = switchEl.checked;
}
undoBtn.onclick = ()=>{
  draggingIndex = -1;
  if(placedParticles.length > 0){
    placedParticles.pop();
    updateCount();
  }
}
clearBtn.onclick = ()=>{
  draggingIndex = -1;
  placedParticles = [];
  updateCount();
}

sizeSlider.oninput = ()=>{
  particleSize = parseFloat(sizeSlider.value);
  sizeValText.innerText = particleSize.toFixed(1);
}
glowSlider.oninput = ()=>{
  glowStrength = parseFloat(glowSlider.value);
  glowValText.innerText = glowStrength.toFixed(1);
}
trailLengthSlider.oninput = ()=>{
  trailMaxLength = parseInt(trailLengthSlider.value);
  trailLenValText.innerText = trailMaxLength;
}
orbitRadiusSlider.oninput = ()=>{
  orbitRadiusSetting = parseInt(orbitRadiusSlider.value);
  orbitRadiusValText.innerText = orbitRadiusSetting;
}
orbitSpeedSlider.oninput = ()=>{
  orbitSpeedSetting = parseFloat(orbitSpeedSlider.value);
  orbitSpeedValText.innerText = orbitSpeedSetting.toFixed(1);
}
motionModeSelect.onchange = ()=>{
  motionMode = motionModeSelect.value;
}

const togglePanelBtn = document.getElementById('toggle-panel-btn');
const sidePanel = document.getElementById('side-panel');
togglePanelBtn.onclick = function(){
  sidePanel.classList.toggle('open');
}

document.addEventListener('mousemove', (e)=>{
  mouseXDoc = e.clientX;
  mouseYDoc = e.clientY;
})

[
  togglePanelBtn, sidePanel, undoBtn, clearBtn, sizeSlider, glowSlider, trailLengthSlider,
  orbitRadiusSlider, orbitSpeedSlider, motionModeSelect, switchEl,
  document.getElementById('enter-btn'),
  document.getElementById('control-panel'), document.getElementById('color-picker'),
  document.getElementById('size-input'), document.getElementById('bold-btn'),
  document.getElementById('alignLeft'), document.getElementById('alignCenter'), document.getElementById('alignRight'),
  document.getElementById('glass-editor'), document.getElementById('rich-editor'),
  document.getElementById('save-btn'), document.getElementById('download-btn')
].forEach(el=>{
  if(el){
    el.addEventListener('click', e=>{
      e.stopPropagation();
    })
  }
})

function saveRange(){
  const sel = window.getSelection();
  if(sel.rangeCount > 0){
    savedRange = sel.getRangeAt(0).cloneRange();
  }
}
function restoreRange(){
  if(!savedRange) return;
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(savedRange);
}

function setFontSize(px){
  restoreRange();
  const sel = window.getSelection();
  if(sel.isCollapsed) return;
  document.execCommand('fontSize', false, '7');
  const fontEl = document.querySelector('font[size="7"]');
  if(fontEl){
    fontEl.removeAttribute('size');
    fontEl.style.fontSize = px + 'px';
  }
}

function setColor(color){
  restoreRange();
  const sel = window.getSelection();
  if(sel.isCollapsed) return;
  document.execCommand('foreColor', false, color);
}

function toggleBold(){
  restoreRange();
  const sel = window.getSelection();
  if(sel.isCollapsed) return;
  document.execCommand('bold', false, null);
}
function alignLeft(){
  restoreRange();
  document.execCommand('justifyLeft', false, null);
}
function alignCenter(){
  restoreRange();
  document.execCommand('justifyCenter', false, null);
}
function alignRight(){
  restoreRange();
  document.execCommand('justifyRight', false, null);
}

function setup() {
  pixelDensity(Math.min(2, window.devicePixelRatio || 1));
  createCanvas(windowWidth, windowHeight, WEBGL);

  for (let i = 0; i < STAR_COUNT; i++) {
    const theta = random(TWO_PI);
    const phi = acos(random(-1, 1));
    const r = random(STAR_SPHERE_RADIUS * 0.3, STAR_SPHERE_RADIUS);
    stars.push({
      x: r * sin(phi) * cos(theta),
      y: r * sin(phi) * sin(theta),
      z: r * cos(phi),
      baseSize: random(1, 3.5),
      twinklePhase: random(0, TWO_PI)
    });
  }

  document.getElementById('enter-btn').addEventListener('click', () => {
    state = 1;
    document.getElementById('enter-btn').classList.add('hidden');
    document.getElementById('mainPage').classList.add('on');
    bgAudio.play().catch(err=>{
      console.log("音频播放失败：", err);
    });
  });

  const saveBtn = document.getElementById('save-btn');
  const downloadBtn = document.getElementById('download-btn');
  const richEditor = document.getElementById('rich-editor');
  const controlPanel = document.getElementById('control-panel');
  const colorPicker = document.getElementById('color-picker');
  const sizeInput = document.getElementById('size-input');
  const boldBtn = document.getElementById('bold-btn');
  const alignLeftBtn = document.getElementById('alignLeft');
  const alignCenterBtn = document.getElementById('alignCenter');
  const alignRightBtn = document.getElementById('alignRight');

  controlPanel.addEventListener('mousedown', e=>{
    saveRange();
  })
  richEditor.addEventListener('mouseup', saveRange);
  richEditor.addEventListener('keyup', saveRange);

  richEditor.addEventListener('focus', () => {
    if (!richEditor.disabled) {
      controlPanel.classList.add('active');
    }
  })
  richEditor.addEventListener('blur', (e) => {
    if (controlPanel.contains(e.relatedTarget)) return;
    controlPanel.classList.remove('active');
  })

  colorPicker.addEventListener('input', ()=>{
    setColor(colorPicker.value);
  })

  function applySize(){
    let num = parseFloat(sizeInput.value);
    if(isNaN(num)) num = 15;
    num = Math.max(8, Math.min(200, num));
    sizeInput.value = num;
    setFontSize(num);
  }
  sizeInput.addEventListener('change', applySize);
  sizeInput.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){
      applySize();
      e.preventDefault();
    }
  })

  boldBtn.addEventListener('click', toggleBold);
  alignLeftBtn.addEventListener('click', alignLeft);
  alignCenterBtn.addEventListener('click', alignCenter);
  alignRightBtn.addEventListener('click', alignRight);

  saveBtn.addEventListener('click', () => {
    saveBtn.classList.add('hidden');
    richEditor.disabled = true;
    controlPanel.classList.remove('active');
    downloadBtn.classList.remove('download-init');
    downloadBtn.classList.add('show');
  });

  downloadBtn.addEventListener('click', () => {
    const htmlContent = richEditor.innerHTML;
    let fullHtml = document.documentElement.outerHTML;
    fullHtml = fullHtml.replace(/<div id="rich-editor"[\s\S]*?>([\s\S]*?)<\/div>/,`<div id="rich-editor" contenteditable="true">$1</div>`);
    fullHtml = fullHtml.replace(/<button id="download-btn"[\s\S]*?<\/button>/,'');
    const blob = new Blob([fullHtml], {type:'text/html;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '星空页面.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });
}

function mousePressed(){
  draggingIndex = -1;
  for(let i = placedParticles.length - 1; i >= 0; i--){
    let p = placedParticles[i];
    let d = dist(mouseX, mouseY, p.baseX, p.baseY);
    if(d < particleSize * 1.5){
      draggingIndex = i;
      dragOffsetX = p.baseX - mouseX;
      dragOffsetY = p.baseY - mouseY;
      break;
    }
  }
}

function mouseDragged(){
  if(draggingIndex >= 0){
    placedParticles[draggingIndex].baseX = mouseX + dragOffsetX;
    placedParticles[draggingIndex].baseY = mouseY + dragOffsetY;
  }
}

function mouseClicked() {
  if(draggingIndex >= 0) return;
  if (!enableParticle) return;

  placedParticles.push({
    baseX: mouseX - 668,
    baseY: mouseY - 436,
    mx: mouseX - 668,
    my: mouseY - 436,
    angle: random(TWO_PI),
    trail: []
  });
  updateCount();
}

function mouseReleased(){
  draggingIndex = -1;
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}

function findNearestParticle(idx){
  const self = placedParticles[idx];
  let minDist = Infinity;
  let target = null;
  for(let i=0;i<placedParticles.length;i++){
    if(i === idx) continue;
    const other = placedParticles[i];
    const d = dist(self.baseX, self.baseY, other.baseX, other.baseY);
    if(d < minDist){
      minDist = d;
      target = other;
    }
  }
  return target;
}

function draw() {
  background(0);
  const time = millis() / 1000;

  if (draggingIndex < 0) {
    targetRotY = map(mouseXDoc, 0, width, -0.5, 0.5);
    targetRotX = map(mouseYDoc, 0, height, 0.35, -0.35);
  }

  currRotX = lerp(currRotX, targetRotX, ROT_LERP);
  currRotY = lerp(currRotY, targetRotY, ROT_LERP);

  push();
  rotateX(currRotX);
  rotateY(currRotY);
  drawStarField();
  pop();

  if (state === 0) drawOrbitParticles();

  push();
  resetMatrix();
  blendMode(ADD);
  noStroke();
  for (let i = 0; i < placedParticles.length; i++) {
    let p = placedParticles[i];

    if(motionMode === "orbitNear"){
      const near = findNearestParticle(i);
      if(near){
        p.angle += orbitSpeedSetting * 0.02;
        p.mx = near.baseX + cos(p.angle) * orbitRadiusSetting;
        p.my = near.baseY + sin(p.angle) * orbitRadiusSetting;
      }else{
        p.mx = p.baseX;
        p.my = p.baseY;
      }
    }else{
      p.mx = p.baseX;
      p.my = p.baseY;
    }

    p.trail.push({x:p.mx, y:p.my});
    if(p.trail.length > trailMaxLength){
      p.trail.shift();
    }

    let baseColor = (i === draggingIndex) ? color(255, 255, 100) : color(255);

    for(let t=0;t<p.trail.length;t++){
      const pt = p.trail[t];
      const alpha = map(t,0,p.trail.length,10,120);
      const rSize = map(t,0,p.trail.length,particleSize*0.15,particleSize*0.4);
      fill(red(baseColor),green(baseColor),blue(baseColor),alpha);
      circle(pt.x,pt.y,rSize);
    }

    for (let j = 4; j >= 1; j--) {
      let r = particleSize * j * glowStrength;
      let a = map(j, 1, 4, 180, 10);
      fill(red(baseColor), green(baseColor), blue(baseColor), a);
      circle(p.mx, p.my, r);
    }

    fill(baseColor);
    circle(p.mx, p.my, particleSize);
  }
  blendMode(BLEND);
  pop();
}

function drawStarField() {
  noStroke();
  const time = millis() / 1000;
  for (const s of stars) {
    push();
    translate(s.x, s.y, s.z);
    const twinkle = 0.6 + 0.4 * sin(time * 1.8 + s.twinklePhase);
    const depthFactor = map(s.z, -STAR_SPHERE_RADIUS, STAR_SPHERE_RADIUS, 0.3, 1);
    const size = s.baseSize * depthFactor * twinkle;
    const alpha = 255 * depthFactor * twinkle;
    fill(255, 255, 255, alpha);
    sphere(size, 4, 4);
    pop();
  }
}

function drawOrbitParticles() {
  const time = millis() / 1000;
  particleAngle = time * 1.2;
  push();
  translate(0, -height / 6, 0);
  noStroke();
  for (let i = 0; i < 3; i++) {
    const angle = particleAngle + i * TWO_PI / 3;
    const r = ORBIT_RADIUS * (0.8 + i * 0.15);
    const x = cos(angle) * r;
    const y = sin(angle) * r;
    push();
    translate(x, y, 0);
    const glow = 0.7 + 0.4 * sin(time * 3 + i);
    fill(180, 210, 255, 220 * glow);
    sphere(4 + i * 1.5, 8);
    fill(180, 255, 255, 30 * glow);
    sphere(10 + i * 3, 8);
    pop();
  }
  pop();
}
</script>
